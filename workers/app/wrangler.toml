# Serves the built TMA Family App (dist/) at https://mytma.org on Cloudflare.
# Deployed by .github/workflows/deploy-app-cloudflare.yml after `vite build`.
name = "tma-app"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Cloudflare creates the DNS records and certificates for these.
routes = [
  { pattern = "mytma.org", custom_domain = true },
  { pattern = "www.mytma.org", custom_domain = true },
]

[assets]
directory = "../../dist"
binding = "ASSETS"
# Run src/index.ts on every request so it can redirect www and add headers.
run_worker_first = true
not_found_handling = "single-page-application"
