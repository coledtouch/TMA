# Serves the built TMA Family App (dist/) at https://mytma.org on Cloudflare.
# Deployed by .github/workflows/deploy-app-cloudflare.yml after `vite build`.
name = "tma-app"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# The app has one address, mytma.org: no tma-app.<subdomain>.workers.dev copy
# and no per-version preview addresses (each would be a separate origin with
# its own sign-ins). src/index.ts also redirects any workers.dev request.
workers_dev = false
preview_urls = false

# Cloudflare creates the DNS records and certificates for these.
routes = [
  { pattern = "mytma.org", custom_domain = true },
  { pattern = "www.mytma.org", custom_domain = true },
]

[assets]
directory = "../../dist"
binding = "ASSETS"
# Run src/index.ts on every request so it can redirect www and add headers.
run_worker_first = true
not_found_handling = "single-page-application"
