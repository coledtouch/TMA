# Tests and deploys the Web Push Worker in workers/push to Cloudflare
# (https://tma-push.<account subdomain>.workers.dev). See workers/push/README.md.
#
# One-time setup: Settings → Secrets and variables → Actions → Secrets
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token made from the "Edit Cloudflare
#                          Workers" template (Workers Scripts: Edit, Workers KV
#                          Storage: Edit, on the TMA account)
#   CLOUDFLARE_ACCOUNT_ID  the TMA account ID (Workers & Pages → Overview,
#                          right-hand column)
# The KV namespace the Worker uses already exists; its id is in
# workers/push/wrangler.toml. Without the secrets this workflow still runs the
# Worker's tests and typecheck, then skips the deploy with a notice.
name: Deploy push Worker (Cloudflare)

on:
  push:
    # The PR branch is listed so the Worker is live before merge. Remove it
    # once merged.
    branches: [main, claude/laughing-goodall-h7za8l]
    paths:
      - 'workers/push/**'
      - '.github/workflows/deploy-push-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let a running deployment finish.
concurrency:
  group: push-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Check for the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Push Worker not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy it (see the top of .github/workflows/deploy-push-worker.yml). Tests still run."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/push/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test the Worker
        run: npm run test:worker

      - name: Typecheck the Worker
        run: npx tsc -p workers/push/tsconfig.json --noEmit

      # Installs the pinned Wrangler from workers/push/package-lock.json, so
      # wrangler-action finds it and does not install one itself.
      - name: Install Wrangler
        if: steps.secrets.outputs.deploy == 'true'
        run: npm ci --prefix workers/push --no-audit --no-fund

      - name: Deploy to Cloudflare
        id: deploy
        if: steps.secrets.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/push
          wranglerVersion: "4.151.3"
          command: deploy

      - name: Report the Worker URL
        if: steps.secrets.outputs.deploy == 'true'
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Push Worker deployed"
            echo
            if [ -n "$WORKER_URL" ]; then
              echo "- URL: $WORKER_URL"
              echo "- Health: $WORKER_URL/health"
              echo
              echo "Put this URL in the Apps Script project (TMA App → Set up)."
            else
              echo "Wrangler did not report a URL; see the Deploy to Cloudflare step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$WORKER_URL" ]; then
            echo "::notice title=Push Worker URL::$WORKER_URL"
            # A brand-new workers.dev subdomain can take a minute to resolve,
            # so a failed check is only a warning.
            if health=$(curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 15 "$WORKER_URL/health"); then
              echo "Health: $health"
              echo "- Health check: \`$health\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=Push Worker health check::$WORKER_URL/health did not answer yet. Try it in a browser in a few minutes."
            fi
          fi

      - name: Note the skipped deploy
        if: steps.secrets.outputs.deploy != 'true'
        run: |
          {
            echo "### Push Worker not deployed"
            echo
            echo "Tests and typecheck passed. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy."
          } >> "$GITHUB_STEP_SUMMARY"
